name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build and test
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet build UnifiMcp.slnx --configuration Release "-p:Version=$version"
          dotnet run --project tests/Unifi.Mcp.Client.SmokeTests/Unifi.Mcp.Client.SmokeTests.csproj `
            --configuration Release --no-build

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-latest
            rid: win-arm64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-latest
            rid: linux-arm64
          - runner: macos-latest
            rid: osx-x64
          - runner: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build release archive
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/Publish-Release.ps1 `
            -Version $version `
            -RuntimeIdentifiers '${{ matrix.rid }}' `
            -SkipValidation

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: unifi-mcp-${{ matrix.rid }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*.tar.gz
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: unifi-mcp-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' \
            artifacts/*.zip artifacts/*.tar.gz artifacts/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "unifi-mcp ${{ github.ref_name }}"
