name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/dotnet.yml

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-latest
            rid: win-arm64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-latest
            rid: linux-arm64
          - runner: macos-latest
            rid: osx-x64
          - runner: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build release archive
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $packageName = "unifi-mcp-v$version-${{ matrix.rid }}"
          $packageRoot = "artifacts/release/$packageName"
          dotnet publish src/UnifiMcp.Stdio/UnifiMcp.Stdio.csproj `
            -c Release -r '${{ matrix.rid }}' --self-contained true `
            -o "$packageRoot/stdio" "-p:Version=$version" `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -p:DebugType=None -p:DebugSymbols=false
          dotnet publish src/UnifiMcp.Http/UnifiMcp.Http.csproj `
            -c Release -r '${{ matrix.rid }}' --self-contained true `
            -o "$packageRoot/http" "-p:Version=$version" `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -p:DebugType=None -p:DebugSymbols=false
          New-Item -ItemType Directory -Force "$packageRoot/assets", "$packageRoot/config", "$packageRoot/docs" | Out-Null
          Copy-Item assets/unifi-mcp.svg "$packageRoot/assets"
          Copy-Item config/*.example.json "$packageRoot/config"
          Copy-Item docs/* "$packageRoot/docs"
          Copy-Item README.md, SECURITY.md, LICENSE "$packageRoot"
          @{ name = 'unifi-mcp'; version = $version; runtimeIdentifier = '${{ matrix.rid }}' } |
            ConvertTo-Json | Set-Content "$packageRoot/version.json" -Encoding utf8NoBOM
          Compress-Archive -LiteralPath $packageRoot `
            -DestinationPath "artifacts/release/$packageName.zip" `
            -CompressionLevel Optimal

      - name: Build release archive
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_name="unifi-mcp-v${version}-${{ matrix.rid }}"
          package_root="artifacts/release/${package_name}"
          dotnet publish src/UnifiMcp.Stdio/UnifiMcp.Stdio.csproj \
            -c Release -r '${{ matrix.rid }}' --self-contained true \
            -o "${package_root}/stdio" "-p:Version=${version}" \
            -p:PublishSingleFile=true -p:PublishTrimmed=false \
            -p:DebugType=None -p:DebugSymbols=false
          dotnet publish src/UnifiMcp.Http/UnifiMcp.Http.csproj \
            -c Release -r '${{ matrix.rid }}' --self-contained true \
            -o "${package_root}/http" "-p:Version=${version}" \
            -p:PublishSingleFile=true -p:PublishTrimmed=false \
            -p:DebugType=None -p:DebugSymbols=false
          chmod +x "${package_root}/stdio/UnifiMcp.Stdio" "${package_root}/http/UnifiMcp.Http"
          mkdir -p "${package_root}/assets" "${package_root}/config" "${package_root}/docs"
          cp assets/unifi-mcp.svg "${package_root}/assets/"
          cp config/*.example.json "${package_root}/config/"
          cp docs/* "${package_root}/docs/"
          cp README.md SECURITY.md LICENSE "${package_root}/"
          printf '{"name":"unifi-mcp","version":"%s","runtimeIdentifier":"%s"}\n' \
            "${version}" '${{ matrix.rid }}' > "${package_root}/version.json"
          tar -czf "artifacts/release/${package_name}.tar.gz" \
            -C artifacts/release "${package_name}"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: unifi-mcp-${{ matrix.rid }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*.tar.gz
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: unifi-mcp-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=()
          if [[ '${{ github.ref_name }}' == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create '${{ github.ref_name }}' \
            artifacts/*.zip artifacts/*.tar.gz artifacts/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "unifi-mcp ${{ github.ref_name }}" \
            "${prerelease_flag[@]}"
